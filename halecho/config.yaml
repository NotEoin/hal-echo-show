# hal-echo-show: packaged defaults.
# Do not edit this file. Put the keys you change in ~/.config/hal-echo-show/config.yaml, with
# the same layout; a key that is not here is an error. The brain and the voice are hal-voice's,
# configured in ~/.config/hal-voice/config.yaml.

server:
  host: 0.0.0.0             # every interface; a connection without a paired certificate fails the TLS handshake
  port: 47800               # the paired, encrypted link
  pair_port: 47801          # open only while `hal-echo pair` runs
  name: null                # shown on the Echo; null uses the PC's host name
  advertise: true           # announce the bridge over mDNS so devices find it after an address change

pairing:
  window_s: 300             # `hal-echo pair` gives up after this long
  max_attempts: 3           # wrong codes before `hal-echo pair` stops listening
  default_mode: desk        # desk | personal | home, for a device paired without --mode

listener:
  # Sent to each device when it connects.
  awake_s: 300              # after the last sound, the device listens for its name this long, then idles
  followup_s: 8             # after a reply, carry on talking without the name for this long
  approval_listen_s: 20     # a spoken approval waits at most this long, as in hal-voice
  stt_model: whisper-base.en-q5_1  # a name from halecho/models.toml; used with stt_location: device
  stt_audio_ctx: 0          # whisper.cpp audio_ctx; 0 is the full 30 s window, smaller is faster
  wake_model: vosk-small-en
  wake_phrases: ["hey hal", "hal", "okay hal"]
  # pc: the Echo records a request addressed to Hal and the PC transcribes it with hal-voice's
  # faster-whisper. device: Whisper on the Echo, about 9 s per request on an Echo Show 5
  # (measured 2026-11-11, docs/howto/benchmark-whisper-on-the-echo.md).
  stt_location: pc          # pc | device
  # Whether saying "Hal" while HAL speaks stops him. auto: only on a device with an echo
  # canceller; without one HAL's own voice triggers it. Tapping the eye always stops him.
  barge_in: auto            # auto | on | off

speaker_eq:
  # Applied to HAL's voice before it is sent, after hal-voice's FX. The Echo Show 5's small
  # speaker cannot play a deep voice's lows, which only muddy it; this trades them for clarity.
  # Restart the bridge after a change; `hal-echo say "..."` plays a line to compare.
  enabled: true
  highpass_hz: 150          # below this the driver only distorts
  mud_hz: 350               # the boxy low mids of a small enclosure
  mud_gain_db: -3.0
  presence_hz: 3500         # consonants: where intelligibility lives
  presence_gain_db: 4.0
  air_hz: 8000
  air_gain_db: 2.0

floor:
  # Several devices hearing one "Hey Hal": the loudest answers.
  window_ms: 350            # wake reports this close together count as one

coexist:
  # true: hal-voice's own loop (hal-voice.service) may run alongside the bridge.
  # false: `hal-echo serve` stops it, so the PC microphone does not answer too.
  hal_voice_loop: false

modes:
  personal:
    denied_packs: [desktop]   # hal-tools packs that touch this PC's screen, keyboard and apps
    persona_note: >-
      You are speaking through a small speaker in a private room, not at the user's desk.
      You cannot see or control the desktop computer from here.
  home:
    persona_note: >-
      You are speaking through a shared speaker in a common room. Other people may hear you.

home_assistant:
  # Home mode is a stub: it answers that Home Assistant is not set up yet.
  url: null                 # for example http://homeassistant.local:8123
  token_file: null          # a file holding a long-lived access token, mode 0600

updates:
  chunk_kib: 256
